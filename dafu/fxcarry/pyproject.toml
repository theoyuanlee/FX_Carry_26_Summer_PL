[project]
name = "fxcarry"
version = "0.0.1"
description = "A modular, generic FX cross-sectional strategy research library — built bottom-up, by hand."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "statsmodels",
    "matplotlib",
    "xbbg",
    "dvc[webdav]",
    # DVC's webdav/OAuth-adjacent deps can pull in an old pyOpenSSL that's
    # incompatible with newer cryptography (AttributeError: module 'lib' has
    # no attribute 'GEN_EMAIL' or similar). Floor both so pip resolves a
    # mutually-compatible pair on a fresh install.
    "pyOpenSSL>=24",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Notebook execution (bake outputs headlessly) and PDF text extraction for
# reading the papers. See docs/next-steps/plans/2026-07-16-full-ber-replication.md.
notebooks = ["nbconvert", "ipykernel", "pypdf"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
